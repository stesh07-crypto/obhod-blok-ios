name: OBhoD iOS — Build & TestFlight

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight'
        required: false
        default: 'true'
        type: boolean

env:
  XCODE_VERSION: '16.0'
  IOS_DEPLOYMENT_TARGET: '15.0'
  BUNDLE_ID: 'net.qwdtt.client.ios'
  APP_NAME: 'OBhoD'
  SCHEME: 'OBhoD'
  CONFIGURATION: 'Release'

jobs:
  build-and-upload:
    name: Build iOS App & Upload to TestFlight
    runs-on: macos-15   # Xcode 16 with iOS 18 SDK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go_client/go.sum

      - name: Select Xcode
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # Pick the highest stable Xcode_16.x.y (avoid the Xcode_16.app symlink)
          XCODE_PATH=$(ls -d /Applications/Xcode_16.[0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ] || [ ! -d "${XCODE_PATH}/Contents/Developer" ]; then
            # Fallback: use whatever xcode-select already points to
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          DEV_DIR="${XCODE_PATH}/Contents/Developer"
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> $GITHUB_ENV
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Go xcframework
        run: |
          chmod +x scripts/build-ios-xcframework.sh
          bash scripts/build-ios-xcframework.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -t agg -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXT_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          echo "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_DIR/obhod_app.mobileprovision"
          echo "$EXT_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_DIR/obhod_ext.mobileprovision"

          APP_UUID=$(security cms -D -i "$PP_DIR/obhod_app.mobileprovision" | grep -A1 '<key>UUID</key>' | grep -oE '[a-f0-9-]{36}' | head -1)
          EXT_UUID=$(security cms -D -i "$PP_DIR/obhod_ext.mobileprovision" | grep -A1 '<key>UUID</key>' | grep -oE '[a-f0-9-]{36}' | head -1)

          if [ -n "$APP_UUID" ]; then cp "$PP_DIR/obhod_app.mobileprovision" "$PP_DIR/${APP_UUID}.mobileprovision"; fi
          if [ -n "$EXT_UUID" ]; then cp "$PP_DIR/obhod_ext.mobileprovision" "$PP_DIR/${EXT_UUID}.mobileprovision"; fi

          echo "=== APP PROVISIONING PROFILE INFO (UUID: $APP_UUID) ==="
          security cms -D -i "$PP_DIR/obhod_app.mobileprovision" | grep -A2 '<key>Name</key>' || true
          security cms -D -i "$PP_DIR/obhod_app.mobileprovision" | grep -A15 '<key>Entitlements</key>' || true

          echo "=== EXT PROVISIONING PROFILE INFO (UUID: $EXT_UUID) ==="
          security cms -D -i "$PP_DIR/obhod_ext.mobileprovision" | grep -A2 '<key>Name</key>' || true
          security cms -D -i "$PP_DIR/obhod_ext.mobileprovision" | grep -A15 '<key>Entitlements</key>' || true

      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -sdk iphoneos \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -archivePath "$RUNNER_TEMP/OBhoD.xcarchive" \
            -destination "generic/platform=iOS" \
            SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD=NO \
            EXCLUDED_ARCHS="x86_64" \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            2>&1 | tee /tmp/archive.log || true
          if grep -q 'ARCHIVE FAILED' /tmp/archive.log || [ ! -d "$RUNNER_TEMP/OBhoD.xcarchive" ]; then
            echo '=== ARCHIVE FAILED - full log tail ==='
            tail -n 150 /tmp/archive.log
            exit 1
          fi

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OBhoD.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "scripts/export.plist" \
            2>&1 | tee /tmp/export.log
          if grep -q 'EXPORT FAILED' /tmp/export.log; then
            echo '=== EXPORT FAILED - error context ==='
            grep -A5 -B5 'error:' /tmp/export.log | tail -30
            exit 1
          fi

          echo "=== ARCHIVED APP ENTITLEMENTS ==="
          codesign -d --entitlements :- "$RUNNER_TEMP/OBhoD.xcarchive/Products/Applications/OBhoD.app" || true

          echo "=== ARCHIVED EXTENSION ENTITLEMENTS ==="
          codesign -d --entitlements :- "$RUNNER_TEMP/OBhoD.xcarchive/Products/Applications/OBhoD.app/PlugIns/TunnelExtension.appex" || true

      - name: Rename IPA
        run: |
          echo "Export directory contents:"
          ls -la "$RUNNER_TEMP/export/" || true
          VERSION=$(defaults read "$RUNNER_TEMP/OBhoD.xcarchive/Info.plist" ApplicationProperties | grep CFBundleShortVersionString | grep -oE '[0-9.]+' | head -1)
          BUILD=$(defaults read "$RUNNER_TEMP/OBhoD.xcarchive/Info.plist" ApplicationProperties | grep CFBundleVersion | grep -oE '[0-9]+' | head -1)
          FINAL_NAME="OBhoD-ios-${VERSION}-b${BUILD}.ipa"
          FOUND_IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "Found IPA: $FOUND_IPA"
          mv "$FOUND_IPA" "$RUNNER_TEMP/export/${FINAL_NAME}"
          echo "IPA_PATH=$RUNNER_TEMP/export/${FINAL_NAME}" >> $GITHUB_ENV
          echo "IPA_NAME=${FINAL_NAME}" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_PATH }}
          retention-days: 3

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_testflight != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          echo "API Key ID: $APP_STORE_CONNECT_API_KEY_ID"
          echo "Issuer ID:  $APP_STORE_CONNECT_API_ISSUER_ID"
          echo "Key file:   $(ls -la $KEY_PATH)"
          echo "IPA:        ${{ env.IPA_PATH }}"

          xcrun altool --upload-app \
            --type ios \
            --file "${{ env.IPA_PATH }}" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --verbose

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
