name: OBhoD iOS — Build & TestFlight
# Automated build & release pipeline for OBhoD iOS
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight (true/false)'
        required: false
        default: 'true'

env:
  IOS_DEPLOYMENT_TARGET: '15.0'
  BUNDLE_ID: 'net.qwdtt.client.ios'
  APP_NAME: 'OBhoD'
  SCHEME: 'OBhoD'
  CONFIGURATION: 'Release'

jobs:
  build-and-upload:
    name: Build iOS App & Upload to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go_client/go.sum

      - name: Select Xcode
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v '/Applications/Xcode.app' | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ] || [ ! -d "${XCODE_PATH}/Contents/Developer" ]; then
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          DEV_DIR="${XCODE_PATH}/Contents/Developer"
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> $GITHUB_ENV
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Go xcframework
        run: |
          chmod +x scripts/build-ios-xcframework.sh
          bash scripts/build-ios-xcframework.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEY_PASS="${KEYCHAIN_PASSWORD:-buildpassword123}"
          security create-keychain -p "$KEY_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEY_PASS" "$KEYCHAIN_PATH"

          # 1. Import DER certificate directly
          if [ -f "keys/distribution.cer" ]; then
            echo "Importing keys/distribution.cer..."
            security import "keys/distribution.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
            openssl x509 -inform der -in keys/distribution.cer -out "$RUNNER_TEMP/cert.pem" 2>/dev/null || true
            security import "$RUNNER_TEMP/cert.pem" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign 2>/dev/null || true
          fi

          # 2. Convert and import RSA private key
          if [ -f "keys/ios_distribution.key" ]; then
            echo "Importing RSA private key..."
            openssl rsa -in keys/ios_distribution.key -out "$RUNNER_TEMP/key_rsa.pem" 2>/dev/null || cp keys/ios_distribution.key "$RUNNER_TEMP/key_rsa.pem"
            security import "$RUNNER_TEMP/key_rsa.pem" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          fi

          # 3. Import certificate.p12 (both with and without password)
          if [ -f "keys/certificate.p12" ]; then
            echo "Importing keys/certificate.p12..."
            security import "keys/certificate.p12" -P "" -A -T /usr/bin/codesign -t agg -f pkcs12 -k "$KEYCHAIN_PATH" || \
            security import "keys/certificate.p12" -P "${CERTIFICATE_PASSWORD:-buildpassword123}" -A -T /usr/bin/codesign -t agg -f pkcs12 -k "$KEYCHAIN_PATH" || true
          fi

          # 4. Import from secret if provided
          if [ -n "$CERTIFICATE_BASE64" ]; then
            echo "$CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/secret.p12"
            security import "$RUNNER_TEMP/secret.p12" -P "${CERTIFICATE_PASSWORD:-}" -A -T /usr/bin/codesign -t agg -f pkcs12 -k "$KEYCHAIN_PATH" || \
            security import "$RUNNER_TEMP/secret.p12" -P "" -A -T /usr/bin/codesign -t agg -f pkcs12 -k "$KEYCHAIN_PATH" || true
          fi

          # 5. Set key partition list so codesign can use private keys without interactive prompt
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEY_PASS" "$KEYCHAIN_PATH" || true
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "=== IMPORTED CODESIGNING IDENTITIES ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXT_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          # 1. Main App Profile
          if [ -n "$APP_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_DIR/obhod_app.mobileprovision"
          elif [ -f "keys/OBhod_app.mobileprovision" ]; then
            cp keys/OBhod_app.mobileprovision "$PP_DIR/obhod_app.mobileprovision"
          fi
          cp "$PP_DIR/obhod_app.mobileprovision" "$PP_DIR/OBhod_app.mobileprovision" 2>/dev/null || true

          # 2. Extension Profile
          if [ -n "$EXT_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$EXT_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_DIR/obhod_ext.mobileprovision"
          elif [ -f "keys/OBhod_ext.mobileprovision" ]; then
            cp keys/OBhod_ext.mobileprovision "$PP_DIR/obhod_ext.mobileprovision"
          fi
          cp "$PP_DIR/obhod_ext.mobileprovision" "$PP_DIR/OBhod_ext.mobileprovision" 2>/dev/null || true

          # 3. Copy by UUID (required by modern Xcode)
          APP_UUID=$(security cms -D -i "$PP_DIR/obhod_app.mobileprovision" 2>/dev/null | grep -A1 '<key>UUID</key>' | grep -oE '[a-f0-9-]{36}' | head -1)
          EXT_UUID=$(security cms -D -i "$PP_DIR/obhod_ext.mobileprovision" 2>/dev/null | grep -A1 '<key>UUID</key>' | grep -oE '[a-f0-9-]{36}' | head -1)

          if [ -n "$APP_UUID" ]; then cp "$PP_DIR/obhod_app.mobileprovision" "$PP_DIR/${APP_UUID}.mobileprovision"; fi
          if [ -n "$EXT_UUID" ]; then cp "$PP_DIR/obhod_ext.mobileprovision" "$PP_DIR/${EXT_UUID}.mobileprovision"; fi

          echo "=== APP PROVISIONING PROFILE ENTITLEMENTS (PlistBuddy) ==="
          security cms -D -i "$PP_DIR/obhod_app.mobileprovision" > /tmp/app.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/app.plist 2>/dev/null || true

          echo "=== EXT PROVISIONING PROFILE ENTITLEMENTS (PlistBuddy) ==="
          security cms -D -i "$PP_DIR/obhod_ext.mobileprovision" > /tmp/ext.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/ext.plist 2>/dev/null || true

      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -sdk iphoneos \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -archivePath "$RUNNER_TEMP/OBhoD.xcarchive" \
            -destination "generic/platform=iOS" \
            SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD=NO \
            EXCLUDED_ARCHS="x86_64" \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            2>&1 | tee /tmp/archive.log || true
          if grep -q 'ARCHIVE FAILED' /tmp/archive.log || [ ! -d "$RUNNER_TEMP/OBhoD.xcarchive" ]; then
            echo '=== ARCHIVE FAILED - full log tail ==='
            tail -n 150 /tmp/archive.log
            exit 1
          fi

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OBhoD.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "scripts/export.plist" \
            2>&1 | tee /tmp/export.log
          if grep -q 'EXPORT FAILED' /tmp/export.log; then
            echo '=== EXPORT FAILED - error context ==='
            grep -A5 -B5 'error:' /tmp/export.log | tail -30
            exit 1
          fi

          echo "=== ARCHIVED APP ENTITLEMENTS ==="
          codesign -d --entitlements :- "$RUNNER_TEMP/OBhoD.xcarchive/Products/Applications/OBhoD.app" || true

          echo "=== ARCHIVED EXTENSION ENTITLEMENTS ==="
          codesign -d --entitlements :- "$RUNNER_TEMP/OBhoD.xcarchive/Products/Applications/OBhoD.app/PlugIns/TunnelExtension.appex" || true

      - name: Rename IPA
        run: |
          echo "Export directory contents:"
          ls -la "$RUNNER_TEMP/export/" || true
          VERSION=$(defaults read "$RUNNER_TEMP/OBhoD.xcarchive/Info.plist" ApplicationProperties | grep CFBundleShortVersionString | grep -oE '[0-9.]+' | head -1)
          BUILD=$(defaults read "$RUNNER_TEMP/OBhoD.xcarchive/Info.plist" ApplicationProperties | grep CFBundleVersion | grep -oE '[0-9]+' | head -1)
          FINAL_NAME="OBhoD-ios-${VERSION:-1.3.9}-b${BUILD:-1}.ipa"
          FOUND_IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "Found IPA: $FOUND_IPA"
          mv "$FOUND_IPA" "$RUNNER_TEMP/export/${FINAL_NAME}"
          echo "IPA_PATH=$RUNNER_TEMP/export/${FINAL_NAME}" >> $GITHUB_ENV
          echo "IPA_NAME=${FINAL_NAME}" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_testflight != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          KEY_ID="${APP_STORE_CONNECT_API_KEY_ID:-795KRDT33X}"
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          elif [ -f "keys/AuthKey_${KEY_ID}.p8" ]; then
            cp "keys/AuthKey_${KEY_ID}.p8" "$KEY_PATH"
          elif [ -f "keys/AuthKey_795KRDT33X.p8" ]; then
            cp "keys/AuthKey_795KRDT33X.p8" "$KEY_PATH"
          fi

          if [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ]; then
            echo "::warning ::APP_STORE_CONNECT_API_ISSUER_ID is not set in secrets. Skipping TestFlight upload. IPA artifact is saved."
            exit 0
          fi

          echo "API Key ID: $KEY_ID"
          echo "Key file:   $(ls -la $KEY_PATH)"
          echo "IPA:        ${{ env.IPA_PATH }}"

          xcrun altool --upload-app \
            --type ios \
            --file "${{ env.IPA_PATH }}" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --verbose

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
