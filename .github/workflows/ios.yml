name: OBhoD iOS — Build & TestFlight
# Automated build & release pipeline for OBhoD iOS
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight (true/false)'
        required: false
        default: 'true'

env:
  IOS_DEPLOYMENT_TARGET: '15.0'
  BUNDLE_ID: 'net.qwdtt.client.ios'
  APP_NAME: 'OBhoD'
  SCHEME: 'OBhoD'
  CONFIGURATION: 'Release'

jobs:
  build-and-upload:
    name: Build iOS App & Upload to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go_client/go.sum

      - name: Select Xcode
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v '/Applications/Xcode.app' | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ] || [ ! -d "${XCODE_PATH}/Contents/Developer" ]; then
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          DEV_DIR="${XCODE_PATH}/Contents/Developer"
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> $GITHUB_ENV
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Go xcframework
        run: |
          chmod +x scripts/build-ios-xcframework.sh
          bash scripts/build-ios-xcframework.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "::error ::Секрет IOS_DISTRIBUTION_CERTIFICATE_BASE64 не установлен в Settings -> Secrets. Скопируйте его из файла GITHUB_SECRETS_READY.md"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEY_PASS="${KEYCHAIN_PASSWORD:-buildpassword123}"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          # Create and unlock temporary build keychain
          security create-keychain -p "$KEY_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEY_PASS" "$KEYCHAIN_PATH"

          # 1. Apple WWDR Intermediate Certificates
          echo "Downloading Apple WWDR CA..."
          curl -sSfL "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" || true
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          curl -sSfL "https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer" -o "$RUNNER_TEMP/AppleWWDRCAG6.cer" || true
          security import "$RUNNER_TEMP/AppleWWDRCAG6.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true

          # 2. Native macOS LibreSSL conversion & import
          python3 - << 'EOF'
          import base64, os, subprocess
          from cryptography.hazmat.primitives.serialization import pkcs12, Encoding, PrivateFormat, NoEncryption
          from cryptography.hazmat.primitives import serialization

          raw_b64 = os.environ.get('CERTIFICATE_BASE64', '').strip()
          raw_data = base64.b64decode(raw_b64)

          key_pem = None
          cert_pem = None

          # Try loading PKCS12
          for pass_candidate in [b"", b"buildpassword123", os.environ.get('CERTIFICATE_PASSWORD', '').encode()]:
              try:
                  p12_obj = pkcs12.load_pkcs12(raw_data, pass_candidate)
                  if p12_obj.key:
                      key_pem = p12_obj.key.private_bytes(Encoding.PEM, PrivateFormat.PKCS8, NoEncryption())
                  if p12_obj.cert:
                      cert_pem = p12_obj.cert.certificate.public_bytes(Encoding.PEM)
                  if key_pem and cert_pem:
                      break
              except Exception:
                  pass

          runner_temp = os.environ.get('RUNNER_TEMP', '/tmp')
          key_path = os.path.join(runner_temp, 'key.pem')
          cert_path = os.path.join(runner_temp, 'cert.pem')
          out_p12 = os.path.join(runner_temp, 'certificate_native.p12')

          if key_pem and cert_pem:
              with open(key_path, 'wb') as f:
                  f.write(key_pem)
              with open(cert_path, 'wb') as f:
                  f.write(cert_pem)
              # Create legacy p12 using macOS native LibreSSL
              subprocess.run(['openssl', 'pkcs12', '-export', '-inkey', key_path, '-in', cert_path, '-out', out_p12, '-passout', 'pass:buildpassword123', '-name', 'Apple Distribution: Sergei Bokarev (4Z5K8Y686M)'], check=True)
              print("Successfully created native macOS PKCS12!")
          else:
              # Save directly if raw_data was already DER or PEM
              with open(out_p12, 'wb') as f:
                  f.write(raw_data)
          EOF

          security import "$RUNNER_TEMP/certificate_native.p12" \
            -P "buildpassword123" \
            -A -T /usr/bin/codesign -t agg -f pkcs12 -k "$KEYCHAIN_PATH" || \
          security import "$RUNNER_TEMP/certificate_native.p12" \
            -P "" \
            -A -T /usr/bin/codesign -t agg -f pkcs12 -k "$KEYCHAIN_PATH" || \
          security import "$RUNNER_TEMP/certificate_native.p12" \
            -A -T /usr/bin/codesign -k "$KEYCHAIN_PATH"

          # 3. Set partition list and default keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEY_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "=== VERIFY IMPORTED SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXT_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APP_PROVISIONING_PROFILE_BASE64" ] || [ -z "$EXT_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error ::Секреты IOS_APP_PROVISIONING_PROFILE_BASE64 или IOS_EXT_PROVISIONING_PROFILE_BASE64 не установлены в Settings -> Secrets. Скопируйте их из файла GITHUB_SECRETS_READY.md"
            exit 1
          fi

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          # 1. Main App Profile
          python3 -c "import base64, os; open('$PP_DIR/obhod_app.mobileprovision', 'wb').write(base64.b64decode(os.environ['APP_PROVISIONING_PROFILE_BASE64'].strip()))"
          cp "$PP_DIR/obhod_app.mobileprovision" "$PP_DIR/OBhod_app.mobileprovision"

          # 2. Extension Profile
          python3 -c "import base64, os; open('$PP_DIR/obhod_ext.mobileprovision', 'wb').write(base64.b64decode(os.environ['EXT_PROVISIONING_PROFILE_BASE64'].strip()))"
          cp "$PP_DIR/obhod_ext.mobileprovision" "$PP_DIR/OBhod_ext.mobileprovision"

          # 3. Copy by UUID (required by modern Xcode)
          APP_UUID=$(security cms -D -i "$PP_DIR/obhod_app.mobileprovision" 2>/dev/null | grep -A1 '<key>UUID</key>' | grep -oE '[a-f0-9-]{36}' | head -1)
          EXT_UUID=$(security cms -D -i "$PP_DIR/obhod_ext.mobileprovision" 2>/dev/null | grep -A1 '<key>UUID</key>' | grep -oE '[a-f0-9-]{36}' | head -1)

          if [ -n "$APP_UUID" ]; then cp "$PP_DIR/obhod_app.mobileprovision" "$PP_DIR/${APP_UUID}.mobileprovision"; fi
          if [ -n "$EXT_UUID" ]; then cp "$PP_DIR/obhod_ext.mobileprovision" "$PP_DIR/${EXT_UUID}.mobileprovision"; fi

          echo "=== APP PROVISIONING PROFILE ENTITLEMENTS (PlistBuddy) ==="
          security cms -D -i "$PP_DIR/obhod_app.mobileprovision" > /tmp/app.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/app.plist 2>/dev/null || true

          echo "=== EXT PROVISIONING PROFILE ENTITLEMENTS (PlistBuddy) ==="
          security cms -D -i "$PP_DIR/obhod_ext.mobileprovision" > /tmp/ext.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/ext.plist 2>/dev/null || true

      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -sdk iphoneos \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -archivePath "$RUNNER_TEMP/OBhoD.xcarchive" \
            -destination "generic/platform=iOS" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ env.KEYCHAIN_PATH }}" \
            SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD=NO \
            EXCLUDED_ARCHS="x86_64" \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            2>&1 | tee /tmp/archive.log || true
          if grep -q 'ARCHIVE FAILED' /tmp/archive.log || [ ! -d "$RUNNER_TEMP/OBhoD.xcarchive" ]; then
            echo '=== ARCHIVE FAILED - full log tail ==='
            tail -n 150 /tmp/archive.log
            exit 1
          fi

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OBhoD.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "scripts/export.plist" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ env.KEYCHAIN_PATH }}" \
            2>&1 | tee /tmp/export.log
          if grep -q 'EXPORT FAILED' /tmp/export.log; then
            echo '=== EXPORT FAILED - error context ==='
            grep -A5 -B5 'error:' /tmp/export.log | tail -30
            exit 1
          fi

          echo "=== ARCHIVED APP ENTITLEMENTS ==="
          codesign -d --entitlements :- "$RUNNER_TEMP/OBhoD.xcarchive/Products/Applications/OBhoD.app" || true

          echo "=== ARCHIVED EXTENSION ENTITLEMENTS ==="
          codesign -d --entitlements :- "$RUNNER_TEMP/OBhoD.xcarchive/Products/Applications/OBhoD.app/PlugIns/TunnelExtension.appex" || true

      - name: Rename IPA
        run: |
          echo "Export directory contents:"
          ls -la "$RUNNER_TEMP/export/" || true
          VERSION=$(defaults read "$RUNNER_TEMP/OBhoD.xcarchive/Info.plist" ApplicationProperties | grep CFBundleShortVersionString | grep -oE '[0-9.]+' | head -1)
          BUILD=$(defaults read "$RUNNER_TEMP/OBhoD.xcarchive/Info.plist" ApplicationProperties | grep CFBundleVersion | grep -oE '[0-9]+' | head -1)
          FINAL_NAME="OBhoD-ios-${VERSION:-1.3.9}-b${BUILD:-1}.ipa"
          FOUND_IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "Found IPA: $FOUND_IPA"
          mv "$FOUND_IPA" "$RUNNER_TEMP/export/${FINAL_NAME}"
          echo "IPA_PATH=$RUNNER_TEMP/export/${FINAL_NAME}" >> $GITHUB_ENV
          echo "IPA_NAME=${FINAL_NAME}" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_testflight != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          KEY_ID="${APP_STORE_CONNECT_API_KEY_ID:-795KRDT33X}"
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            python3 -c "import base64, os; open('$KEY_PATH', 'wb').write(base64.b64decode(os.environ['APP_STORE_CONNECT_API_KEY_BASE64'].strip()))"
          fi

          if [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ] || [ ! -f "$KEY_PATH" ]; then
            echo "::warning ::APP_STORE_CONNECT_API_ISSUER_ID или ключ API не установлены в Secrets. Пропускаем загрузку в TestFlight. Артефакт IPA успешно сохранен в сборке."
            exit 0
          fi

          echo "API Key ID: $KEY_ID"
          echo "Key file:   $(ls -la $KEY_PATH)"
          echo "IPA:        ${{ env.IPA_PATH }}"

          xcrun altool --upload-app \
            --type ios \
            --file "${{ env.IPA_PATH }}" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --verbose

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
