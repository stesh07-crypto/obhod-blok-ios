name: OBhoD
options:
  bundleIdPrefix: net.qwdtt.client
  deploymentTarget:
    iOS: '15.0'
  minimumXcodeVersion: '15.0'
  objectVersion: 56
  generateEmptyDirectories: true
  groupOrdering:
    - pattern: 'OBhoD'
    - pattern: 'TunnelExtension'
    - pattern: 'Shared'

settings:
  base:
    DEVELOPMENT_TEAM: '4Z5K8Y686M'
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/Frameworks
      - $(SRCROOT)/Frameworks/libwdttclient.xcframework/ios-arm64/Headers
      - $(SRCROOT)/Frameworks/libwdttclient.xcframework/ios-arm64-simulator/Headers

targets:

  # ── Main Application ───────────────────────────────────────────────────
  OBhoD:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: OBhoD
        excludes:
          - '**/*.md'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.qwdtt.client.ios
        PRODUCT_NAME: OBhoD
        INFOPLIST_FILE: OBhoD/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_TARGET_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: OBhoD/App/OBhoD.entitlements
        OTHER_LDFLAGS: '-ObjC'
        SWIFT_OBJC_BRIDGING_HEADER: OBhoD/App/OBhoD-Bridging-Header.h
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OBhod_app
    dependencies:
      - target: TunnelExtension
      - framework: Frameworks/libwdttclient.xcframework
        embed: false
    entitlements:
      path: OBhoD/App/OBhoD.entitlements

  # ── Network Extension ──────────────────────────────────────────────────
  TunnelExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: TunnelExtension
      - path: OBhoD/Core/AppGroup.swift
      - path: OBhoD/Core/GoClient.swift
      - path: OBhoD/Core/ProfilesStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.qwdtt.client.ios.tunnel
        PRODUCT_NAME: TunnelExtension
        INFOPLIST_FILE: TunnelExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelExtension/TunnelExtension.entitlements
        OTHER_LDFLAGS: '-ObjC'
        SWIFT_OBJC_BRIDGING_HEADER: TunnelExtension/TunnelExtension-Bridging-Header.h
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OBhod_ext
    dependencies:
      - framework: Frameworks/libwdttclient.xcframework
        embed: false
    entitlements:
      path: TunnelExtension/TunnelExtension.entitlements
