name: OBhoD
options:
  bundleIdPrefix: net.qwdtt.client
  deploymentTarget:
    iOS: '15.0'
  minimumXcodeVersion: '15.0'
  objectVersion: 56
  generateEmptyDirectories: true
  groupOrdering:
    - pattern: 'OBhoD'
    - pattern: 'TunnelExtension'
    - pattern: 'LiveActivityExtension'
    - pattern: 'Shared'

settings:
  base:
    DEVELOPMENT_TEAM: '4Z5K8Y686M'
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/Frameworks
      - $(SRCROOT)/Frameworks/libwdttclient.xcframework/ios-arm64/Headers
      - $(SRCROOT)/Frameworks/libwdttclient.xcframework/ios-arm64-simulator/Headers

targets:

  # ── Main Application ───────────────────────────────────────────────────
  # The app owns UI, profiles and subscription state only. It does not link
  # or start the Go tunnel runtime anymore.
  OBhoD:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: OBhoD
        excludes:
          - '**/*.md'
          - 'Core/GoClient.swift'
      - path: Shared/OBhoDLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.qwdtt.client.ios
        PRODUCT_NAME: OBhoD
        INFOPLIST_FILE: OBhoD/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: OBhoD/App/OBhoD.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: OBhod_app
        OTHER_LDFLAGS: '-ObjC'
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OBhod_app
          CODE_SIGN_ENTITLEMENTS: OBhoD/App/OBhoD.entitlements
    dependencies:
      - target: TunnelExtension
      - target: LiveActivityExtension
    entitlements:
      path: OBhoD/App/OBhoD.entitlements

  # ── Network Extension ──────────────────────────────────────────────────
  # The extension is the single owner of Go, TURN and WireGuard runtime.
  TunnelExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: TunnelExtension
      - path: OBhoD/Core/AppGroup.swift
      - path: OBhoD/Core/GoClient.swift
      - path: OBhoD/Core/ProfilesStore.swift
      - path: OBhoD/Core/SubscriptionImport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.qwdtt.client.ios.tunnel
        PRODUCT_NAME: TunnelExtension
        INFOPLIST_FILE: TunnelExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelExtension/TunnelExtension.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: OBhod_ext
        OTHER_LDFLAGS: '-ObjC'
        SWIFT_OBJC_BRIDGING_HEADER: TunnelExtension/TunnelExtension-Bridging-Header.h
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OBhod_ext
          CODE_SIGN_ENTITLEMENTS: TunnelExtension/TunnelExtension.entitlements
    dependencies:
      - framework: Frameworks/libwdttclient.xcframework
        embed: false
    entitlements:
      path: TunnelExtension/TunnelExtension.entitlements

  # ── Live Activity / Dynamic Island ─────────────────────────────────────
  # WidgetKit renders the Lock Screen and Dynamic Island surfaces. The app
  # owns ActivityKit lifecycle and sends dynamic state to this extension.
  LiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: '16.1'
    sources:
      - path: LiveActivityExtension
      - path: Shared/OBhoDLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.qwdtt.client.ios.liveactivity
        PRODUCT_NAME: OBhoDLiveActivity
        INFOPLIST_FILE: LiveActivityExtension/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: '16.1'
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: OBhod_live
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OBhod_live
